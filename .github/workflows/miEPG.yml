name: miEPG
on:
  schedule:
    - cron: '30 10 * * * ' # Ejecutar a las 12:30 PM (ten en cuenta el horario verano/invierno)
  workflow_dispatch:
permissions:
   contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v2
    - name: Comprobar e Instalar xmllint
      run: |
        sudo apt-get update && sudo apt-get install -y libxml2-utils
    - name: Dar permisos de ejecución al script
      run: |
        chmod +x .github/workflows/EPG_script.sh
    - name: Generar EPGs manuales (fechas siempre frescas)
        run: python3 generar_epg_manual.py
    - name: Ejecutar script
      run: .github/workflows/EPG_script.sh
    - name: Comprimir XML para SSIPTV
      run: gzip -c miEPG.xml > miEPG.xml.gz
    - name: Configurar identidad de Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
    - name: Subir archivos 
      run: |
        git add .
        git commit -m "Nuevo miEPG.xml"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
